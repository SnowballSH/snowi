# Packet configuration. Sections print in this order.
sections = [
  "contest",
  "math",
  "ds",
  "ds2",
  "graph",
  "flow",
  "tree",
  "strings",
  "numtheory",
  "combo",
  "poly",
  "linalg",
  "geometry",
  "dp",
  "offline",
  "misc",
  "guide",
]

# ICPC rules: university and team name upper left, page number upper right.
[team]
university = "University"
team = "Team snowi"

# Commands and file names printed in Contest > Setup (and wherever a
# note uses #cmd). Match them to the contest machines and your habits.
[commands]
cxx = "g++"          # C++ compiler
std = "gnu++20"      # C++ standard, as in -std=...
cpp = "cpp"          # C preprocessor, for the typing hash
pypy = "pypy3"       # PyPy interpreter
python = "python3"   # any Python 3, for hash.py
source = "a"         # the solution: a.cpp or a.py, compiled to ./a
brute = "brute"      # brute force, for stress tests
gen = "gen"          # random test generator
judge = "judge"      # local interactor

[layout]
paper = "us-letter"     # "a4" is also allowed by ICPC rules
columns = 3
line-limit = 64         # characters of code per column; code font scales

[icpc]
title = "snowi ICPC notebook"
page-limit = 25

[full]
title = "snowi full notebook"
